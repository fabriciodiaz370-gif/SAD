<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Pádel Miramar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0B0B0B; --card:#161616; --card-2:#1D1D1D; --line:#2A2A2A;
--lime:#D2F23A; --lime-dim:rgba(210,242,58,0.15);
--white:#F5F5F5; --grey:#9B9B9B; --red:#E5484D; --red-dim:rgba(229,72,77,0.15);
--font-display:'Montserrat',sans-serif; --font-body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--white);font-family:var(--font-body);line-height:1.5;}
a{color:inherit;text-decoration:none;}
button, select, input{font-family:var(--font-body);}
input, select{
background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--white);
padding:10px 12px;font-size:0.9rem;outline:none;width:100%;
}
input:focus, select:focus{border-color:var(--lime);}
label{font-size:0.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;display:block;margin-bottom:6px;}

nav{
display:flex;align-items:center;justify-content:space-between;padding:18px 4vw;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10;
}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:900;font-size:1.05rem;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);}
.navlink{font-weight:700;font-size:0.82rem;color:var(--grey);border:1px solid var(--line);padding:9px 16px;border-radius:8px;}
.navlink:hover{color:var(--white);border-color:var(--lime);}

.section-tabs{display:flex;gap:8px;padding:20px 4vw;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.section-tab{
font-weight:700;font-size:0.85rem;padding:10px 18px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);
color:var(--grey);cursor:pointer;
}
.section-tab.active{background:var(--lime);color:#0B0B0B;border-color:var(--lime);}

.layout{display:grid;grid-template-columns:1fr;gap:0;max-width:1400px;margin:0 auto;}
@media(min-width:900px){.layout{grid-template-columns:280px 1fr;}}

.sidebar{padding:26px 20px;border-right:1px solid var(--line);display:none;}
.sidebar.show{display:block;}
.sidebar h3{font-family:var(--font-display);font-size:0.85rem;letter-spacing:0.06em;color:var(--grey);margin-bottom:16px;}
.torneo-item{
padding:13px 14px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;
font-size:0.88rem;font-weight:600;transition:all .15s;
}
.torneo-item:hover{border-color:var(--lime);}
.torneo-item.active{background:var(--lime-dim);border-color:var(--lime);color:var(--lime);}
.torneo-item small{display:block;color:var(--grey);font-weight:500;font-size:0.74rem;margin-top:2px;}
.torneo-item.active small{color:var(--lime);opacity:0.75;}

.btn{
font-weight:700;font-size:0.85rem;padding:12px 18px;border-radius:9px;border:none;cursor:pointer;
display:inline-flex;align-items:center;gap:8px;transition:transform .15s;
}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--lime);color:#0B0B0B;}
.btn-outline{background:transparent;color:var(--white);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--lime);}
.btn-danger{background:var(--red-dim);color:var(--red);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:8px 12px;font-size:0.78rem;}

.main{padding:26px 4vw 60px;}
.section{display:none;}
.section.active{display:block;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:22px;}
.panel h2{font-family:var(--font-display);font-weight:800;font-size:1.15rem;margin-bottom:18px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
.grid-3{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){.grid-3{grid-template-columns:1fr 1fr 1fr;}}
.field{margin-bottom:0;}

.check-pill{
padding:9px 16px;border-radius:8px;border:1px solid var(--line);font-size:0.82rem;font-weight:700;cursor:pointer;color:var(--grey);
}
.check-pill.active{background:var(--lime);color:#0B0B0B;border-color:var(--lime);}

.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:9px 18px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);color:var(--grey);font-weight:700;font-size:0.82rem;cursor:pointer;}
.tab.active{background:var(--lime);color:#0B0B0B;border-color:var(--lime);}

.pareja-row, .jugador-row{
display:flex;align-items:center;justify-content:space-between;gap:10px;
padding:11px 14px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
}
.pareja-row .nombre, .jugador-row .nombre{font-size:0.88rem;font-weight:600;}
.pareja-row .x, .jugador-row .x{cursor:pointer;color:var(--grey);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pareja-row .x:hover, .jugador-row .x:hover{color:var(--red);background:var(--red-dim);}

.foto-preview{width:60px;height:60px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.foto-preview img{width:100%;height:100%;object-fit:cover;}
.foto-preview.empty{color:var(--grey);font-size:0.7rem;}

.add-pareja-form, .add-jugador-form{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.add-pareja-form input, .add-jugador-form input, .add-jugador-form select{flex:1;min-width:140px;}

.empty-state{color:var(--grey);font-size:0.88rem;text-align:center;padding:30px 10px;}

.bracket-wrap{overflow-x:auto;padding-top:6px;}
.bracket{display:flex;gap:36px;min-width:700px;}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:14px;flex:1;min-width:190px;}
.round-label{text-align:center;font-size:0.68rem;font-weight:700;color:var(--grey);letter-spacing:0.08em;margin-bottom:4px;}
.match{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:0.8rem;}
.match .side{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;gap:6px;}
.match .side.winner{color:var(--lime);font-weight:700;}
.match .side.bye{color:var(--grey);font-style:italic;}
.match .side.tbd{color:var(--grey);}
.win-btn{
font-size:0.68rem;font-weight:700;padding:5px 9px;border-radius:6px;border:1px solid var(--line);
background:transparent;color:var(--grey);cursor:pointer;flex-shrink:0;
}
.win-btn:hover{border-color:var(--lime);color:var(--lime);}
.decided-tag{font-size:0.68rem;color:var(--lime);}

.toast{
position:fixed;bottom:20px;right:20px;background:var(--card-2);border:1px solid var(--lime);color:var(--lime);
padding:12px 18px;border-radius:10px;font-size:0.85rem;font-weight:600;opacity:0;transform:translateY(10px);
transition:all .25s;pointer-events:none;z-index:100;
}
.toast.show{opacity:1;transform:translateY(0);}
.loading{padding:60px;text-align:center;color:var(--grey);}

.file-input{display:none;}
  
  /* Estilos para configuración de puntos */
  .puntos-config{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:400px){.puntos-config{grid-template-columns:1fr 1fr;}}
  .puntos-config-item{display:flex;align-items:center;gap:10px;}
  .puntos-config-item label{margin-bottom:0;flex:1;}
  .puntos-config-item input{width:80px;text-align:center;}
</style>
</head>
<body>

<nav>
<div class="brand"><span class="dot"></span>PÁDEL MIRAMAR · ADMIN</div>
<a class="navlink" href="index.html">Ver sitio público →</a>
</nav>

<div class="section-tabs">
<button class="section-tab active" data-section="torneos">Torneos & Llave</button>
<button class="section-tab" data-section="jugadores">Jugadores</button>
  <button class="section-tab" data-section="configuracion">Configuración</button>
</div>

<div id="app" class="loading">Cargando datos…</div>
<div class="toast" id="toast">Guardado ✓</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import {
SUPABASE_URL, SUPABASE_ANON_KEY, CATEGORIAS, CATEGORIA_LABEL, LATERALIDADES,
  uid, generateBracket, propagateWinner, roundLabel, loadState, saveState, isAprobada, POINTS_PER_WIN, sumarPuntosAlGanador
  uid, generateBracket, propagateWinner, roundLabel, loadState, saveState, isAprobada, 
  POINTS_PER_WIN, sumarPuntosAlGanador, POINTS_BY_POSITION, crearOActualizarJugadoresDesdePareja,
  asignarPuntosPorPosicion, getPosicionFinal
} from './shared.js';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

let state = null;
let activeTorneoId = null;
let activeTab = {};
let currentSection = 'torneos';
let lastStateJson = '';
let isSaving = false;

function toast(msg){
toastEl.textContent = msg;
toastEl.classList.add('show');
setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

async function persist(){
isSaving = true;
try{
await saveState(supabase, state);
lastStateJson = JSON.stringify(state);
toast('Guardado ✓');
}catch(e){
console.error(e);
toast('Error al guardar');
}finally{
isSaving = false;
}
}

function activeTorneo(){
return state.torneos.find(t=>t.id===activeTorneoId) || null;
}

// ---- RENDER GENERAL ----
function render(){
const html = `
   <div class="layout">
     ${currentSection==='torneos' ? `<div class="sidebar show">
       <h3>TORNEOS</h3>
       <div id="torneo-list"></div>
       <button class="btn btn-outline btn-block" id="btn-nuevo-torneo" style="margin-top:10px;">+ Nuevo torneo</button>
     </div>` : '<div></div>'}
     <div class="main">
       <div id="section-torneos" class="section ${currentSection==='torneos'?'active':''}"></div>
       <div id="section-jugadores" class="section ${currentSection==='jugadores'?'active':''}"></div>
        <div id="section-configuracion" class="section ${currentSection==='configuracion'?'active':''}"></div>
     </div>
   </div>
 `;
app.innerHTML = html;

// Botones de sección
document.querySelectorAll('.section-tab').forEach(btn=>{
btn.onclick = ()=>{
document.querySelectorAll('.section-tab').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
currentSection = btn.dataset.section;
render();
};
});

if(currentSection==='torneos'){
renderTorneosSection();
  } else {
  } else if(currentSection==='jugadores'){
renderJugadoresSection();
  } else if(currentSection==='configuracion'){
    renderConfiguracionSection();
}
}

// ---- SECCIÓN TORNEOS ----
function renderTorneosSection(){
const t = activeTorneo();
const el = document.getElementById('section-torneos');

// Lista de torneos
const list = document.getElementById('torneo-list');
if(list){
list.innerHTML = '';
state.torneos.forEach(tr=>{
const div = document.createElement('div');
div.className = 'torneo-item' + (tr.id===activeTorneoId ? ' active' : '');
const totalParejas = Object.values(tr.parejas).reduce((a,arr)=>a+arr.length,0);
      div.innerHTML = `${tr.nombre}<small>${tr.fecha} · ${totalParejas} parejas</small>`;
      div.innerHTML = `${escapeHtml(tr.nombre)}<small>${escapeHtml(tr.fecha)} · ${totalParejas} parejas</small>`;
div.onclick = ()=>{ activeTorneoId = tr.id; render(); };
list.appendChild(div);
});
document.getElementById('btn-nuevo-torneo').onclick = crearTorneo;
}

if(!t){
    el.innerHTML = '<div class="panel"><div class="empty-state">Elegí un torneo o creá uno nuevo.</div></div>';
    el.innerHTML = '<div class="panel"><div class="empty-state">Elige un torneo o crea uno nuevo.</div></div>';
return;
}

el.innerHTML = renderTorneoPanel(t);
wireTorneoPanel(t);
}

function renderTorneoPanel(t){
return `
   <div class="panel">
     <h2>Datos del torneo
       <button class="btn btn-danger btn-sm" id="btn-borrar-torneo">Eliminar</button>
     </h2>
     <div class="grid-3">
       <div class="field"><label>Nombre</label><input id="f-nombre" value="${escapeHtml(t.nombre)}"></div>
       <div class="field"><label>Fecha</label><input id="f-fecha" value="${escapeHtml(t.fecha)}"></div>
       <div class="field"><label>Lugar</label><input id="f-lugar" value="${escapeHtml(t.lugar)}"></div>
     </div>
     <label style="margin-top:14px;">Categorías</label>
     <div style="display:flex;gap:10px;flex-wrap:wrap;">
       ${CATEGORIAS.map(c=>`<div class="check-pill ${t.categorias.includes(c)?'active':''}" data-cat="${c}">${CATEGORIA_LABEL[c]}</div>`).join('')}
     </div>
   </div>
   ${renderPostulacionesPanel(t)}
   <div class="panel">
     <h2>Parejas y llave</h2>
      ${t.categorias.length===0 ? '<div class="empty-state">Elegí al menos una categoría.</div>' : `
      ${t.categorias.length===0 ? '<div class="empty-state">Elige al menos una categoría.</div>' : `
       <div class="tabs" id="cat-tabs">
         ${t.categorias.map(c=>`<div class="tab ${ (activeTab[t.id]||t.categorias[0])===c ? 'active':''}" data-cat="${c}">${CATEGORIA_LABEL[c]}</div>`).join('')}
       </div>
       <div id="cat-content"></div>
     `}
   </div>
 `;
}

function wireTorneoPanel(t){
document.getElementById('f-nombre').addEventListener('change', e=>{ t.nombre=e.target.value; persist(); render(); });
document.getElementById('f-fecha').addEventListener('change', e=>{ t.fecha=e.target.value; persist(); });
document.getElementById('f-lugar').addEventListener('change', e=>{ t.lugar=e.target.value; persist(); });

document.getElementById('btn-borrar-torneo').onclick = ()=>{
if(!confirm(`¿Eliminar "${t.nombre}"?`)) return;
state.torneos = state.torneos.filter(x=>x.id!==t.id);
activeTorneoId = state.torneos[0]?.id || null;
persist(); render();
};

  document.querySelectorAll('input[data-cat]').forEach(el=>{
    el.classList.remove('check-pill');
  });
  
document.querySelectorAll('[data-cat]').forEach(el=>{
el.onclick = ()=>{
const cat = el.dataset.cat;
if(t.categorias.includes(cat)){
if(!confirm(`¿Quitar ${CATEGORIA_LABEL[cat]}?`)) return;
t.categorias = t.categorias.filter(c=>c!==cat);
delete t.parejas[cat]; delete t.brackets[cat];
} else {
t.categorias.push(cat);
t.parejas[cat] = []; t.brackets[cat] = null;
        // Inicializar puntos por posición para esta categoría
        if(!t.puntos_por_posicion) t.puntos_por_posicion = {};
        if(!t.puntos_por_posicion[cat]) t.puntos_por_posicion[cat] = { ...POINTS_BY_POSITION };
}
persist(); render();
};
});

if(t.categorias.length>0){
const currentCat = activeTab[t.id] || t.categorias[0];
activeTab[t.id] = currentCat;
document.getElementById('cat-content').innerHTML = renderCategoriaContent(t, currentCat);
wireCategoriaContent(t, currentCat);

document.querySelectorAll('#cat-tabs .tab').forEach(el=>{
el.onclick = ()=>{ activeTab[t.id]=el.dataset.cat; render(); };
});
}
}

function renderPostulacionesPanel(t){
  const pendientes = (t.parejas[t.categorias[0]] || []).filter(p=>p.estado==='pendiente');
  const pendientes = [];
  t.categorias.forEach(cat => {
    pendientes.push(...(t.parejas[cat] || []).filter(p=>p.estado==='pendiente'));
  });
return `
   <div class="panel">
     <h2>Postulaciones pendientes ${pendientes.length ? `<span style="background:var(--red-dim);color:var(--red);font-size:0.7rem;font-weight:800;padding:5px 11px;border-radius:6px;">${pendientes.length}</span>` : ''}</h2>
     ${pendientes.length===0 ? '<div class="empty-state">No hay postulaciones.</div>' :
       pendientes.map(p=>{
         const cat = Object.keys(t.parejas).find(c=>(t.parejas[c]||[]).find(x=>x.id===p.id));
         return `
           <div class="pareja-row">
             <span class="nombre">${escapeHtml(p.j1)} / ${escapeHtml(p.j2)}<span style="color:var(--grey);font-size:0.78rem;"> — ${cat?CATEGORIA_LABEL[cat]:'N/A'}</span></span>
             <span style="display:flex;gap:6px;">
               <button class="btn btn-primary btn-sm" data-aprobar="${cat}:${p.id}">Aprobar</button>
               <button class="btn btn-danger btn-sm" data-rechazar="${cat}:${p.id}">Rechazar</button>
             </span>
           </div>
         `;
       }).join('')
     }
   </div>
 `;
}

function wirePostulacionesPanel(t){
document.querySelectorAll('[data-aprobar]').forEach(btn=>{
btn.onclick = ()=>{
const [cat, id] = btn.dataset.aprobar.split(':');
const p = (t.parejas[cat]||[]).find(x=>x.id===id);
      if(p){ p.estado = 'aprobada'; persist(); render(); }
      if(p){ 
        p.estado = 'aprobada';
        // Crear jugadores si no existen
        crearOActualizarJugadoresDesdePareja(state, p);
        persist(); render(); 
      }
};
});
document.querySelectorAll('[data-rechazar]').forEach(btn=>{
btn.onclick = ()=>{
const [cat, id] = btn.dataset.rechazar.split(':');
if(!confirm('¿Rechazar?')) return;
t.parejas[cat] = (t.parejas[cat]||[]).filter(x=>x.id!==id);
persist(); render();
};
});
}

function renderCategoriaContent(t, cat){
const parejas = (t.parejas[cat] || []).filter(isAprobada);
const bracket = t.brackets[cat];
return `
   <div class="grid-2" style="align-items:start;">
     <div>
       <label>Parejas (${parejas.length})</label>
       <div id="parejas-list">
         ${parejas.length===0 ? '<div class="empty-state">Sin parejas.</div>' :
           parejas.map(p=>`
             <div class="pareja-row">
               <span class="nombre">${escapeHtml(p.j1)} / ${escapeHtml(p.j2)}</span>
               <span class="x" data-remove="${p.id}">✕</span>
             </div>
           `).join('')
         }
       </div>
       <div class="add-pareja-form">
         <input id="new-j1" placeholder="Jugador 1">
         <input id="new-j2" placeholder="Jugador 2">
         <button class="btn btn-primary btn-sm" id="btn-add-pareja">+ Agregar</button>
       </div>
       <button class="btn btn-outline btn-block" id="btn-generar-llave" style="margin-top:16px;" ${parejas.length<2?'disabled':''}>
         ${bracket ? 'Regenerar llave' : 'Generar llave'}
       </button>
        ${bracket ? `
          <button class="btn btn-primary btn-block" id="btn-asignar-puntos" style="margin-top:10px;">
            Asignar Puntos por Posición
          </button>
        ` : ''}
     </div>
     <div>
       <label>Llave — ${CATEGORIA_LABEL[cat]}</label>
       ${ bracket ? '<div class="bracket-wrap"><div class="bracket" id="bracket-view"></div></div>' : '<div class="empty-state">Generá la llave.</div>' }
     </div>
   </div>
 `;
}

function wireCategoriaContent(t, cat){
document.querySelectorAll('[data-remove]').forEach(el=>{
el.onclick = ()=>{
t.parejas[cat] = t.parejas[cat].filter(p=>p.id!==el.dataset.remove);
persist(); render();
};
});

document.getElementById('btn-add-pareja').onclick = ()=>{
const j1 = document.getElementById('new-j1').value.trim();
const j2 = document.getElementById('new-j2').value.trim();
if(!j1 || !j2){ toast('Completá los nombres'); return; }
    t.parejas[cat].push({ id: uid('p'), j1_id: null, j2_id: null, j1, j2, telefono:'', estado:'aprobada' });
    
    const nuevaPareja = { id: uid('p'), j1_id: null, j2_id: null, j1, j2, telefono:'', estado:'aprobada' };
    t.parejas[cat].push(nuevaPareja);
    
    // Crear jugadores automáticamente
    crearOActualizarJugadoresDesdePareja(state, nuevaPareja);
    
persist(); render();
};

const btnGenerar = document.getElementById('btn-generar-llave');
if(btnGenerar){
btnGenerar.onclick = ()=>{
if(t.brackets[cat] && !confirm('¿Reiniciar?')) return;
t.brackets[cat] = generateBracket(t.parejas[cat]);
persist(); render();
};
}

  const btnAsignarPuntos = document.getElementById('btn-asignar-puntos');
  if(btnAsignarPuntos){
    btnAsignarPuntos.onclick = ()=>{
      if(!confirm('¿Asignar puntos a todas las parejas según su posición final?')) return;
      asignarPuntosPorPosicion(state, t.id, cat);
      persist(); render();
      toast('Puntos asignados ✓');
    };
  }

if(t.brackets[cat]) renderBracketView(t, cat);
}

function teamLabel(team){
if(!team) return '<span style="color:var(--grey);">Por definir</span>';
if(team.bye) return '<span style="color:var(--grey);font-style:italic;">BYE</span>';
return `${escapeHtml(team.j1)} / ${escapeHtml(team.j2)}`;
}

function renderBracketView(t, cat){
const rounds = t.brackets[cat];
const wrap = document.getElementById('bracket-view');
wrap.innerHTML = '';
rounds.forEach((round, ri)=>{
const roundEl = document.createElement('div');
roundEl.className = 'round';
const lab = document.createElement('div');
lab.className = 'round-label';
lab.textContent = roundLabel(ri, rounds.length);
roundEl.appendChild(lab);

round.forEach((match, mi)=>{
const matchEl = document.createElement('div');
matchEl.className = 'match';
const canDecide = match.teamA && match.teamB && !match.teamA.bye && !match.teamB.bye && !match.winner;
const decided = !!match.winner;

const sideClass = team => {
if(!team) return 'tbd';
if(team.bye) return 'bye';
if(decided && team.id===match.winner?.id) return 'winner';
return '';
};

matchEl.innerHTML = `
       <div class="side ${sideClass(match.teamA)}">
         <span>${teamLabel(match.teamA)}</span>
         ${canDecide ? `<button class="win-btn" data-round="${ri}" data-match="${mi}" data-side="A">Ganó</button>` : ''}
       </div>
       <div class="side ${sideClass(match.teamB)}">
         <span>${teamLabel(match.teamB)}</span>
         ${canDecide ? `<button class="win-btn" data-round="${ri}" data-match="${mi}" data-side="B">Ganó</button>` : ''}
       </div>
       ${decided ? `<div class="decided-tag">Definido ✓</div>` : ''}
     `;
roundEl.appendChild(matchEl);
});
wrap.appendChild(roundEl);
});

wrap.querySelectorAll('.win-btn').forEach(btn=>{
btn.onclick = ()=>{
const ri = parseInt(btn.dataset.round), mi = parseInt(btn.dataset.match);
const match = rounds[ri][mi];
const winner = btn.dataset.side==='A' ? match.teamA : match.teamB;
propagateWinner(rounds, ri, mi, winner);
      // Sumar puntos al ganador
      // Sumar puntos al ganador (por partido ganado)
if(winner && !winner.bye){
sumarPuntosAlGanador(state, t.id, cat, winner.id);
}
persist(); render();
};
});
}

// ---- SECCIÓN CONFIGURACIÓN ----
function renderConfiguracionSection(){
  const el = document.getElementById('section-configuracion');
  
  // Inicializar configuración si no existe
  if(!state.configuracion) {
    state.configuracion = { puntos_por_posicion: { ...POINTS_BY_POSITION } };
  }
  
  el.innerHTML = `
    <div class="panel">
      <h2>Configuración Global de Puntos</h2>
      <p style="color:var(--grey);margin-bottom:20px;">
        Configura cuántos puntos recibe cada jugador según su posición final en el torneo.
      </p>
      <div class="puntos-config" id="puntos-config">
        ${Object.entries(POINTS_BY_POSITION).map(([pos, valor]) => `
          <div class="puntos-config-item">
            <label>${pos.toUpperCase()}</label>
            <input type="number" id="puntos-${pos}" value="${state.configuracion.puntos_por_posicion[pos] || valor}" min="0">
          </div>
        `).join('')}
      </div>
      <button class="btn btn-primary" id="btn-guardar-config" style="margin-top:20px;">Guardar Configuración</button>
    </div>
    
    <div class="panel">
      <h2>Configuración por Torneo</h2>
      <p style="color:var(--grey);margin-bottom:20px;">
        Cada torneo puede tener su propia configuración de puntos.
      </p>
      <div id="torneos-config-list"></div>
    </div>
  `;
  
  // Cargar valores actuales
  Object.entries(POINTS_BY_POSITION).forEach(([pos]) => {
    const input = document.getElementById(`puntos-${pos}`);
    if(input) {
      input.value = state.configuracion.puntos_por_posicion[pos] || POINTS_BY_POSITION[pos];
    }
  });
  
  // Guardar configuración global
  document.getElementById('btn-guardar-config').onclick = () => {
    Object.entries(POINTS_BY_POSITION).forEach(([pos]) => {
      const input = document.getElementById(`puntos-${pos}`);
      if(input) {
        state.configuracion.puntos_por_posicion[pos] = parseInt(input.value) || 0;
      }
    });
    persist();
    toast('Configuración guardada ✓');
  };
  
  // Lista de torneos para configuración individual
  const torneosList = document.getElementById('torneos-config-list');
  if(torneosList) {
    torneosList.innerHTML = state.torneos.map(torneo => {
      const config = torneo.puntos_por_posicion || {};
      return `
        <div style="margin-bottom:20px;border:1px solid var(--line);border-radius:10px;padding:15px;">
          <h3 style="font-size:0.9rem;font-weight:700;margin-bottom:10px;">${escapeHtml(torneo.nombre)}</h3>
          <div class="puntos-config">
            ${Object.entries(POINTS_BY_POSITION).map(([pos]) => {
              const valor = config[torneo.categorias[0]]?.[pos] || config[pos] || POINTS_BY_POSITION[pos];
              return `
                <div class="puntos-config-item">
                  <label>${pos.toUpperCase()}</label>
                  <input type="number" data-torneo="${torneo.id}" data-pos="${pos}" value="${valor}" min="0">
                </div>
              `;
            }).join('')}
          </div>
          <button class="btn btn-primary btn-sm" data-torneo="${torneo.id}" style="margin-top:10px;">Guardar</button>
        </div>
      `;
    }).join('');
    
    // Eventos para guardar configuración por torneo
    document.querySelectorAll('[data-torneo]').forEach(btn => {
      btn.onclick = () => {
        const torneoId = btn.dataset.torneo;
        const torneo = state.torneos.find(t => t.id === torneoId);
        if(!torneo) return;
        
        if(!torneo.puntos_por_posicion) {
          torneo.puntos_por_posicion = {};
        }
        
        // Guardar configuración para todas las categorías del torneo
        torneo.categorias.forEach(cat => {
          if(!torneo.puntos_por_posicion[cat]) {
            torneo.puntos_por_posicion[cat] = { ...POINTS_BY_POSITION };
          }
        });
        
        // Actualizar valores
        Object.entries(POINTS_BY_POSITION).forEach(([pos]) => {
          const input = document.querySelector(`[data-torneo="${torneoId}"][data-pos="${pos}"]`);
          if(input) {
            const valor = parseInt(input.value) || 0;
            torneo.categorias.forEach(cat => {
              if(torneo.puntos_por_posicion[cat]) {
                torneo.puntos_por_posicion[cat][pos] = valor;
              }
            });
          }
        });
        
        persist();
        toast('Configuración del torneo guardada ✓');
      };
    });
  }
}

// ---- FUNCIONES UTILITARIAS ----
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
}

async function pollUpdatesAdmin(){
if(isSaving) return;
try{
const newState = await loadState(supabase);
const newStateJson = JSON.stringify(newState);
if(newStateJson !== lastStateJson){
state = newState;
lastStateJson = newStateJson;
render();
}
}catch(e){
console.error('Error en polling:', e);
}
}

// ---- INIT ----
(async function init(){
try{
state = await loadState(supabase);
if(!state.jugadores) state.jugadores = [];
    if(!state.configuracion) state.configuracion = { puntos_por_posicion: { ...POINTS_BY_POSITION } };
    // Asegurar que todos los torneos tengan configuración de puntos
    state.torneos.forEach(torneo => {
      if(!torneo.puntos_por_posicion) {
        torneo.puntos_por_posicion = { ...POINTS_BY_POSITION };
      }
    });
lastStateJson = JSON.stringify(state);
activeTorneoId = state.torneos[0]?.id || null;
render();
setInterval(pollUpdatesAdmin, 2000);
}catch(e){
console.error(e);
app.innerHTML = `<div class="panel"><div class="empty-state">Error conectando con la base de datos.</div></div>`;
}
})();
</script>
